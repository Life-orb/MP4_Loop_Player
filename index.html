<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
    }

    .container {
        width: 100%;
        max-width: 650px;
        text-align: center;
    }

    h1 {
        font-size: 42px;
        margin: 0 0 15px;
    }

    .description {
        color: #ccc;
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 30px;
    }

    .input-container {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        min-width: 0;
        padding: 16px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        outline: none;
    }

    button {
        padding: 16px 25px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .info {
        margin-top: 35px;
        color: #999;
        font-size: 14px;
        line-height: 1.6;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 32px;
        }

        .input-container {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }
</style>


</head>

<body>

<main class="container">


<h1>MP4 Loop Player</h1>

<p class="description">
    Play MP4 videos continuously online.
    Enter a direct MP4 video URL and the video will automatically
    loop when it reaches the end.
</p>

<form onsubmit="playVideo(event)">

    <div class="input-container">

        <input
            id="videoUrl"
            type="url"
            placeholder="https://example.com/video.mp4"
            aria-label="MP4 video URL"
            required
        >

        <button type="submit">
            Play
        </button>

    </div>

</form>

<p class="info">
    MP4 Loop Player works in modern web browsers and can be used
    on computers, phones, tablets, and compatible smart TVs.
</p>


</main>

<script>
function playVideo(event) {
    event.preventDefault();

    const input = document.getElementById("videoUrl");
    const url = input.value.trim();

    if (!url) {
        return;
    }

    window.location.href =
        "player.html?url=" + encodeURIComponent(url);
}
</script>

</body>
</html>
